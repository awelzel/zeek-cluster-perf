---
zeek:
  cluster:
    config:
      autogen_dir: tmp/auto-generated
      spool_dir: spool

    default:
      cpu: "0,1,2,3"
      host: "127.0.0.1"
      interface: "af_packet::lo"
      ignore_checksums: true
      bare_mode: true
      scripts:
        - local.zeek

    manager:
      port: 17001/tcp
    proxies:
      - port: 17101/tcp
      - port: 17102/tcp
      - port: 17103/tcp
      - port: 17104/tcp
    loggers:
      - port: 17201/tcp
      - port: 17202/tcp
    workers:
      - cpu: 4
      - cpu: 5
      - cpu: 6
      - cpu: 7
      - cpu: 8
      - cpu: 9
      - cpu: 10
      - cpu: 11
      - cpu: 4
      - cpu: 5
      - cpu: 6
      - cpu: 7
      - cpu: 8
      - cpu: 9
      - cpu: 10
      - cpu: 11
